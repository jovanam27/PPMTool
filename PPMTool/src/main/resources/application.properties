spring.application.name=PPMTool

# Prikaz SQL upita u konzoli
spring.jpa.show-sql=true

# MySQL konekcija
spring.datasource.url=jdbc:mysql://localhost:3306/ppmtcourse?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=password

# Dijalekat
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Automatsko kreiranje/ažuriranje tabela
spring.jpa.hibernate.ddl-auto=update